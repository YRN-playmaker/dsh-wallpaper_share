[package]
name = "we-capture"
version = "0.4.3"
edition = "2021"
description = "Wallpaper Engine 实时画面捕获器：用 Windows Graphics Capture 抓 WE 壁纸窗口，按 SceneAdapter 协议输出 JPEG 帧流"
license = "MIT"
# build.rs 注入 src 指纹；版本号必须与 src/main.rs 的 VERSION 一致（npm run check:package 会校验）

[[bin]]
name = "we-capture"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_System_Com",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  # 几何上报：显式 DPI 感知 + GetDpiForWindow（把 Win32 物理坐标换算成浏览器同尺度的逻辑像素）
  "Win32_UI_HiDpi",
  # WinRT 互操作（Graphics Capture 帧池）：捕获路径所需，与 Windows 运行时类型同源
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Graphics_Capture",
  "Foundation",
  "Foundation_Collections",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jpeg-encoder = { version = "0.7", features = ["simd"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
