# 发布当前分支的包到 npm。
# 触发：Actions 页面手动 Run workflow（选分支）。
# 凭证：仓库 secret NPM_TOKEN（npmjs.com → Access Tokens → Publish 类型）。
# 仓库自带预构建 lib/，无需 install/build，直接 publish。
# 版本语义：-D → latest + desktop；纯数字版本 → web；-T → test；-rc* → rc。
# desktop 是安装渠道，-D 是版本号后缀；默认安装始终优先桌面版。
# 手动 tag 输入可覆盖渠道；latest / desktop 仅允许 -D 版本，并同步更新两者。
name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只演练（--dry-run），不真正发布
        type: boolean
        default: false
      tag:
        description: dist-tag（留空自动选：D→latest+desktop，纯数字→web，T→test，rc→rc）
        type: string
        default: ''

permissions:
  contents: read
  id-token: write # npm provenance（发布来源证明，降低风控误判）

jobs:
  publish:
    runs-on: ubuntu-24.04
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check package encoding and entries
        run: |
          npm run check:package
          npm run test:package

      - name: Publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true && '--dry-run' || '' }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          V=$(node -p "require('./package.json').version")
          TAG=""
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          elif [[ "$V" == *-* ]]; then
            SUFFIX="${V##*-}"
            case "$SUFFIX" in
              D) TAG=latest ;;
              [Tt]|test) TAG=test ;;
              rc*) TAG=rc ;;
              *) echo "Unknown version suffix: $SUFFIX. Specify a dist-tag explicitly." >&2; exit 1 ;;
            esac
          else
            TAG=web
          fi
          if [[ "$TAG" == latest || "$TAG" == desktop ]]; then
            if [[ "$V" != *-D ]]; then
              echo "latest / desktop require a -D version." >&2
              exit 1
            fi
            TAG=latest
          fi
          npm publish --provenance --tag "$TAG" $DRY_RUN
          if [[ "$TAG" == latest && -z "$DRY_RUN" ]]; then
            npm dist-tag add "$(node -p "require('./package.json').name")@$V" desktop
          fi

      - name: Show result
        if: ${{ inputs.dry_run != true }}
        run: npm view dsh-wallpaper_share dist-tags
