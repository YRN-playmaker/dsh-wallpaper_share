# 发布当前 main 分支到 npm（latest 标签）。
# 触发：Actions 页面手动 Run workflow（选 main 分支）。
# 凭证：仓库 secret NPM_TOKEN（npmjs.com → Access Tokens → Publish 类型）。
# 仓库自带预构建 lib/，无需 install/build，直接 publish。
name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只演练（--dry-run），不真正发布
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # npm provenance（发布来源证明，降低风控误判）

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish
        run: npm publish --provenance ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
